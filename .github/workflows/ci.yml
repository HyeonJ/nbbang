name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 상태 검사다 — 커밋 범위를 diff하지 않고, schema.ts를 **커밋된 스냅샷**과 직접 비교한다.
      # 범위 기반 가드(~b36f505)를 이걸로 대체한 이유:
      #  1) 여러 커밋을 한꺼번에 덮는 force push는 HEAD^..HEAD로 후퇴해서, 교체된 범위 안쪽에
      #     있는 schema.ts 단독 변경을 아예 들여다보지 못했다.
      #  2) 손으로 고친 마이그레이션(0001_composite_fk.sql이 그렇다)이 스냅샷과 어긋난 경우를
      #     범위 diff로는 원리적으로 볼 수 없다. 상태 검사는 "지금 schema.ts로 generate하면
      #     새 마이그레이션이 나오는가"를 물으므로 히스토리 모양과 무관하게 항상 같은 답을 준다.
      #
      # 0.31.10에서 확인한 generate의 실제 동작 (이 스텝의 판정 방식이 여기서 나온다):
      #  - DB에 접속하지 않는다. url이 postgresql://unused여도 정상 동작한다(스냅샷끼리 비교하므로).
      #  - 동기 상태면 "No schema changes, nothing to migrate"만 찍고 **아무 파일도 쓰지 않는다**
      #    — meta/_journal.json 타임스탬프도 건드리지 않아서 git status가 깨끗하게 유지된다.
      #  - 드리프트가 있으면 새 .sql + meta/NNNN_snapshot.json을 쓰고 _journal.json을 수정하지만
      #    **종료코드는 0이다**. 그래서 판정은 종료코드가 아니라 git status로 한다.
      #  - 컬럼 이름 변경처럼 모호한 경우엔 TTY가 없어 프롬프트를 못 띄우고 죽는데, 이때도
      #    종료코드가 0이고 파일도 안 쓴다 — git status만 보면 통과해 버린다.
      #    그래서 동기 확인 메시지가 실제로 나왔는지도 함께 본다.
      - name: 스키마와 마이그레이션 동기화 확인
        env:
          DATABASE_URL: postgresql://unused # generate는 DB에 접속하지 않는다
        run: |
          set -euo pipefail
          # 로그는 워크스페이스 밖에 쓴다 — 레포 안에 쓰면 그 자체가 작업트리를 더럽힌다.
          LOG="$RUNNER_TEMP/drizzle-generate.log"
          npx drizzle-kit generate 2>&1 | tee "$LOG"
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::schema.ts가 커밋된 스냅샷과 다릅니다 — 로컬에서 npm run db:generate 하고 drizzle/ 전체(.sql + meta/)를 커밋하세요"
            git status --porcelain drizzle/
            exit 1
          fi
          # ⚠️ 'No schema changes'는 **drizzle-kit이 찍는 문구**다(0.31.10에서 확인). 즉 이 가드는
          # 서드파티의 출력 문장에 매달려 있다 — 버전을 올려 문구가 바뀌면 "동기 상태인데도"
          # 이 grep이 실패해 check 잡이 빨개진다. 그 실패는 드리프트가 아니라 **문구 변경**이므로,
          # 여기서 빨개지고 위 git status는 깨끗하다면 새 버전의 실제 출력을 보고 이 문자열을
          # 고치는 것이 옳은 대응이다(가드를 지우는 것이 아니다). 반대로 이 grep을 느슨하게
          # 하면 "프롬프트를 못 띄워 죽은" 경우가 다시 조용히 통과한다 — 이 2단 판정의 존재 이유다.
          if ! grep -q 'No schema changes' "$LOG"; then
            echo "::error::generate가 동기화를 확인하지 못했습니다(위 출력 참조) — 로컬에서 npm run db:generate 로 확인하세요. drizzle-kit 버전을 올렸다면 'No schema changes' 문구 자체가 바뀌었을 수 있습니다(이 스텝의 주석 참고)"
            exit 1
          fi
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 통합 테스트는 브라우저·빌드가 필요 없으므로 playwright install보다 **앞**에 둔다 —
      # DB 왕복 불변식이 깨졌으면 여기서 싸게 빨개진다.
      # `check` 잡은 DB 시크릿을 갖지 않는다(단위 테스트는 DB 없이 돌아야 한다) — 그래서 이 잡이다.
      # 스크립트의 `dotenv -e .env.test`는 파일이 없으면 조용히 건너뛴다(CI에는 없다) —
      # 로컬과 CI가 **같은 명령**을 쓴다. 스키마 동기화(migrate)는 이 스위트의 globalSetup이 한다.
      - run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
      # CI 리포터는 'github'이라 playwright-report/가 생기지 않는다 — 실패 증거는
      # test-results/(trace.zip, error-context.md)에 있다. 둘 다 올린다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
  # 배포 권한은 여기 한 곳에만 둔다 — Vercel Git 자동배포는 vercel.json의
  # git.deploymentEnabled.main=false로 꺼져 있어 이 잡이 **유일한 배포 경로**다.
  # 그래서 이 잡의 실패를 무시하거나 끄면 아무도 프로덕션을 배포하지 않는 상태가 된다.
  # (프로젝트 설정 gitProviderOptions.createDeployments="disabled"는 저장은 되지만
  #  효과가 없다 — 그 값으로 두고도 push마다 source=git 배포가 계속 생성됐다.
  #  실제로 끄는 것은 vercel.json뿐이다. vercel.json을 지우면 이중 배포가 돌아온다.)
  #
  # ⚠️ Vercel CLI를 쓰지 않는 이유 (되돌리지 말 것):
  # 등록된 VERCEL_TOKEN은 **프로젝트 스코프** 토큰이다. `GET /v9/projects/{id}`는 200인데
  # `GET /v2/user`는 404, `GET /v2/teams`는 403이다. CLI는 모든 명령이 먼저 사용자를
  # 조회하므로 whoami·project ls·deploy가 전부 "User not found"로 죽는다 — 토큰 값이
  # 무효한 게 아니라 CLI가 요구하는 스코프가 아니다. REST 배포 API는 그 조회를 하지 않아
  # 이 토큰으로 정상 동작한다. 그래서 배포는 scripts/vercel-deploy.mjs(REST)가 한다.
  # `npx vercel deploy`로 "단순화"하면 배포가 다시 깨진다. 계정 스코프 토큰으로
  # 교체되기 전까지는 CLI가 구조적으로 불가능하다.
  # (부수 효과로 REST가 더 낫다: gitSource.sha로 CI가 검증한 커밋을 못 박아 배포한다.)
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # migrate는 적용할 게 없어도 항상 "applied successfully"를 찍는다 — 전후 이력 행 수가
      # 실제 증거다. 이 두 스텝이 프로덕션에 적용된 것이 있는지/없는지를 로그에 남긴다.
      - name: 적용 이력 (migrate 전)
        run: node scripts/print-migration-history.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # 스키마를 먼저 올리고 그 다음 앱을 배포한다 — 순서가 뒤집히면 새 코드가 없는 컬럼을 읽는다.
      # 이 스텝이 실패하면 잡이 멈추므로 배포는 일어나지 않고, 프로덕션은 이전 배포로 계속 서비스된다.
      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - name: 적용 이력 (migrate 후)
        run: node scripts/print-migration-history.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # 배포 훅도, CLI도 아니라 REST 배포 API다 — 이유는 위 잡 주석 참조.
      # 스크립트가 끝 상태(READY/ERROR/CANCELED)까지 폴링하고 ERROR·CANCELED·타임아웃에
      # 실패로 종료한다. POST만 하고 끝내면 빌드가 깨져도 잡이 초록이 되어 의미가 없다.
      # ORG/REPO/PROJECT ID는 공개 식별자라 시크릿이 아니다(토큰만 시크릿).
      # VERCEL_ORG_ID는 이 스텝이 쓰지 않지만, 다음 사람이 CLI를 다시 시도할 때 필요한
      # 값이라 함께 남긴다.
      - name: Vercel 프로덕션 배포 (REST API)
        run: node scripts/vercel-deploy.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Fw7fjivbiHUvhwLS52TEFl5N
          VERCEL_PROJECT_ID: prj_i7EtOouVzfqcORSYuZKAOqefMZnG
          VERCEL_REPO_ID: '1365561122'
          # ref는 브랜치 메타데이터용이고, 실제 배포되는 것은 GITHUB_SHA다 —
          # CI가 검증한 커밋과 배포된 커밋이 어긋나지 않게 sha를 명시한다.
          VERCEL_GIT_REF: main
          GITHUB_SHA: ${{ github.sha }}
