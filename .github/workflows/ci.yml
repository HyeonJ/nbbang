name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 드리프트 가드가 커밋 범위를 diff하므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # schema.ts만 고치고 마이그레이션을 안 만든 커밋을 여기서 잡는다.
      # PR은 베이스 브랜치와, main 직접 푸시는 푸시된 범위(before..HEAD)와 비교한다
      # — 이 레포는 main 직접 푸시 워크플로라 PR만 검사하면 가드가 아무것도 막지 못한다.
      - name: 스키마 변경 시 마이그레이션 파일 필수
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          elif [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               || ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            # 브랜치 첫 푸시·force push·GC된 커밋 — 이전 상태가 없으므로 마지막 커밋만 본다.
            if git rev-parse -q --verify HEAD^ >/dev/null; then RANGE="HEAD^..HEAD"; else RANGE="$(git hash-object -t tree /dev/null)..HEAD"; fi
          else
            RANGE="$BEFORE..HEAD"
          fi
          echo "비교 범위: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE")
          echo "$CHANGED"
          SCHEMA=$(printf '%s\n' "$CHANGED" | grep -cx 'lib/db/schema.ts' || true)
          MIGRATION=$(printf '%s\n' "$CHANGED" | grep -cE '^drizzle/.*\.sql$' || true)
          if [ "$SCHEMA" -gt 0 ] && [ "$MIGRATION" -eq 0 ]; then
            echo "schema.ts가 바뀌었는데 drizzle/ 마이그레이션이 없습니다 — npm run db:generate 하세요"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
      # CI 리포터는 'github'이라 playwright-report/가 생기지 않는다 — 실패 증거는
      # test-results/(trace.zip, error-context.md)에 있다. 둘 다 올린다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
  # 배포 권한은 여기 한 곳에만 둔다 — Vercel Git 자동배포를 끄면 이 잡이 유일한 배포 경로가
  # 되므로, 이 잡의 실패를 무시하거나 끄면 아무도 프로덕션을 배포하지 않는 상태가 된다.
  # (자동배포는 이 잡이 한 번 초록이 된 뒤에 vercel.json으로 끈다 — 순서를 뒤집으면
  #  프로덕션을 배포하는 주체가 한동안 아무도 없게 된다.)
  #
  # ⚠️ Vercel CLI를 쓰지 않는 이유 (되돌리지 말 것):
  # 등록된 VERCEL_TOKEN은 **프로젝트 스코프** 토큰이다. `GET /v9/projects/{id}`는 200인데
  # `GET /v2/user`는 404, `GET /v2/teams`는 403이다. CLI는 모든 명령이 먼저 사용자를
  # 조회하므로 whoami·project ls·deploy가 전부 "User not found"로 죽는다 — 토큰 값이
  # 무효한 게 아니라 CLI가 요구하는 스코프가 아니다. REST 배포 API는 그 조회를 하지 않아
  # 이 토큰으로 정상 동작한다. 그래서 배포는 scripts/vercel-deploy.mjs(REST)가 한다.
  # `npx vercel deploy`로 "단순화"하면 배포가 다시 깨진다. 계정 스코프 토큰으로
  # 교체되기 전까지는 CLI가 구조적으로 불가능하다.
  # (부수 효과로 REST가 더 낫다: gitSource.sha로 CI가 검증한 커밋을 못 박아 배포한다.)
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # migrate는 적용할 게 없어도 항상 "applied successfully"를 찍는다 — 전후 이력 행 수가
      # 실제 증거다. 이 두 스텝이 프로덕션에 적용된 것이 있는지/없는지를 로그에 남긴다.
      - name: 적용 이력 (migrate 전)
        run: node scripts/print-migration-history.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # 스키마를 먼저 올리고 그 다음 앱을 배포한다 — 순서가 뒤집히면 새 코드가 없는 컬럼을 읽는다.
      # 이 스텝이 실패하면 잡이 멈추므로 배포는 일어나지 않고, 프로덕션은 이전 배포로 계속 서비스된다.
      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - name: 적용 이력 (migrate 후)
        run: node scripts/print-migration-history.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # 배포 훅도, CLI도 아니라 REST 배포 API다 — 이유는 위 잡 주석 참조.
      # 스크립트가 끝 상태(READY/ERROR/CANCELED)까지 폴링하고 ERROR·CANCELED·타임아웃에
      # 실패로 종료한다. POST만 하고 끝내면 빌드가 깨져도 잡이 초록이 되어 의미가 없다.
      # ORG/REPO/PROJECT ID는 공개 식별자라 시크릿이 아니다(토큰만 시크릿).
      # VERCEL_ORG_ID는 이 스텝이 쓰지 않지만, 다음 사람이 CLI를 다시 시도할 때 필요한
      # 값이라 함께 남긴다.
      - name: Vercel 프로덕션 배포 (REST API)
        run: node scripts/vercel-deploy.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Fw7fjivbiHUvhwLS52TEFl5N
          VERCEL_PROJECT_ID: prj_i7EtOouVzfqcORSYuZKAOqefMZnG
          VERCEL_REPO_ID: '1365561122'
          # ref는 브랜치 메타데이터용이고, 실제 배포되는 것은 GITHUB_SHA다 —
          # CI가 검증한 커밋과 배포된 커밋이 어긋나지 않게 sha를 명시한다.
          VERCEL_GIT_REF: main
          GITHUB_SHA: ${{ github.sha }}
