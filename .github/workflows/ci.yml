name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 드리프트 가드가 커밋 범위를 diff하므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # schema.ts만 고치고 마이그레이션을 안 만든 커밋을 여기서 잡는다.
      # PR은 베이스 브랜치와, main 직접 푸시는 푸시된 범위(before..HEAD)와 비교한다
      # — 이 레포는 main 직접 푸시 워크플로라 PR만 검사하면 가드가 아무것도 막지 못한다.
      - name: 스키마 변경 시 마이그레이션 파일 필수
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          elif [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               || ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            # 브랜치 첫 푸시·force push·GC된 커밋 — 이전 상태가 없으므로 마지막 커밋만 본다.
            if git rev-parse -q --verify HEAD^ >/dev/null; then RANGE="HEAD^..HEAD"; else RANGE="$(git hash-object -t tree /dev/null)..HEAD"; fi
          else
            RANGE="$BEFORE..HEAD"
          fi
          echo "비교 범위: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE")
          echo "$CHANGED"
          SCHEMA=$(printf '%s\n' "$CHANGED" | grep -cx 'lib/db/schema.ts' || true)
          MIGRATION=$(printf '%s\n' "$CHANGED" | grep -cE '^drizzle/.*\.sql$' || true)
          if [ "$SCHEMA" -gt 0 ] && [ "$MIGRATION" -eq 0 ]; then
            echo "schema.ts가 바뀌었는데 drizzle/ 마이그레이션이 없습니다 — npm run db:generate 하세요"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
      # CI 리포터는 'github'이라 playwright-report/가 생기지 않는다 — 실패 증거는
      # test-results/(trace.zip, error-context.md)에 있다. 둘 다 올린다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
  # 배포 권한은 여기 한 곳에만 둔다 — Vercel Git 자동배포를 끄면 이 잡이 유일한 배포 경로가
  # 되므로, 이 잡의 실패를 무시하면 아무도 배포하지 않는 상태가 된다.
  #
  # ⚠️ 막힘(2026-09-15): 등록된 VERCEL_TOKEN이 Vercel API에 거부된다("The token provided via
  # `--token` argument is not valid" / whoami "User not found"). 길이 60자에 공백도 없으니
  # 형식은 맞고 값이 무효(폐기됐거나 오타)다. 토큰은 CLI 세션으로 재발급할 수 없어
  # (POST /v3/user/tokens → 403 "Cannot create tokens for this app") 사람이 대시보드에서
  # 만들어 `gh secret set VERCEL_TOKEN`으로 넣어야 한다. 그때까지:
  #   - migrate 스텝까지는 정상 동작한다(프로덕션 이력 1행 유지 = 무동작 확인됨).
  #   - 배포 스텝만 빨갛다. 이 잡을 끄거나 무시하지 말 것 — 빨간 것이 유일한 신호다.
  #   - Vercel Git 자동배포는 **아직 켜져 있다**(아래 참고). 그래서 프로덕션은 계속 배포된다.
  #     토큰이 고쳐질 때까지 자동배포를 끄면 아무도 배포하지 않게 되므로 끄지 않는다.
  #   - 참고: 프로젝트 설정 gitProviderOptions.createDeployments="disabled"는 저장돼 있는데도
  #     push마다 source=git 프로덕션 배포가 계속 생성된다(효과 없음). 실제로 끄려면
  #     vercel.json의 git.deploymentEnabled={"main": false}를 써야 한다 — 토큰 수정 후에 한다.
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # migrate는 적용할 게 없어도 항상 "applied successfully"를 찍는다 — 전후 이력 행 수가
      # 실제 증거다. 이 두 스텝이 프로덕션에 적용된 것이 있는지/없는지를 로그에 남긴다.
      - name: 적용 이력 (migrate 전)
        run: node scripts/print-migration-history.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # 스키마를 먼저 올리고 그 다음 앱을 배포한다 — 순서가 뒤집히면 새 코드가 없는 컬럼을 읽는다.
      # 이 스텝이 실패하면 잡이 멈추므로 배포는 일어나지 않고, 프로덕션은 이전 배포로 계속 서비스된다.
      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - name: 적용 이력 (migrate 후)
        run: node scripts/print-migration-history.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # 배포 훅 대신 CLI + 토큰 — 훅은 "발동 시점의 브랜치 HEAD"를 빌드하지만
      # 이 방식은 CI가 검증한 바로 이 커밋을 배포한다. (개정 근거는 플랜 판정 표 참조)
      # --prebuilt(vercel pull + vercel build)는 쓰지 않는다: 빌드는 Vercel에서 돌려
      # 지금까지 성공해 온 Git 배포와 같은 빌드 환경을 유지하고, 프로덕션 자격증명을
      # 러너 파일시스템(.vercel/.env.production.local)에 내려받지 않는다.
      # .vercel/은 gitignore돼 있어 체크아웃에 없다 — ORG/PROJECT ID를 env로 주면 링크 없이 배포된다.
      # 배포가 "Could not retrieve Project Settings"로 실패하면 거의 항상 토큰 문제다.
      # CLI가 안내하는 ".vercel 디렉터리를 지우고 다시 배포"는 오답이다 — .vercel/은 gitignore돼
      # 있어 CI 체크아웃엔 애초에 없다. 판정은 아래 배포 스텝이 하고 이 스텝은 원인만 남긴다.
      - name: 토큰 확인 (진단용 — 실패해도 잡을 멈추지 않는다)
        continue-on-error: true
        run: |
          npx --yes vercel@51 whoami --token "$VERCEL_TOKEN" \
            || echo "VERCEL_TOKEN이 Vercel API에 거부됐습니다 — Vercel 대시보드 Account Settings → Tokens에서 스코프를 이 프로젝트의 팀으로 두고 새로 만든 뒤 'gh secret set VERCEL_TOKEN'으로 등록하세요."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Vercel 프로덕션 배포
        run: npx --yes vercel@51 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Fw7fjivbiHUvhwLS52TEFl5N
          VERCEL_PROJECT_ID: prj_i7EtOouVzfqcORSYuZKAOqefMZnG
